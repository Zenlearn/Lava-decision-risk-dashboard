services:
  # postgres service removed — DB now hosted externally on Neon (free managed
  # Postgres), same pattern as PathwaysBackend/Meridian using MongoDB Atlas.
  # Survives this instance being deleted, unlike the old self-hosted volume.
  # See DATABASE_URL in .env for the Neon connection string.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # NOTE: no host port published. PathwaysBackend's docker-compose.yml
    # already binds host port 6379 for its own Redis container on this same
    # VM — publishing 6379 here too would collide and fail to start. Lava's
    # app container reaches this one internally via the Docker network as
    # "redis:6379"; nothing outside Docker needs to reach it directly.
    volumes:
      - lava-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  lava-api:
    build: .
    container_name: pathwaysbackend-lava-api-1
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3010:3010"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  lava-redis-data:
